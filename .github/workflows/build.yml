

name: Build FR GEN AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Check project
        run: |
          echo "GitHub Actions is ready."
          ls -la

      - name: Save build status
        run: |
          mkdir -p output
          echo "Android build environment ready. Project source required." > output/status.txt

      - name: Upload status
        uses: actions/upload-artifact@v4
        with:
          name: build-status
          path: output/status.txt
          
